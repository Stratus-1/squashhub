name: Deploy Help Center support functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squashhub-help-center-support-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: squashhub-support-publisher
    steps:
      - name: Check out canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify publisher contract before deployment
        run: |
          npm ci --ignore-scripts
          npm test -- --run src/test/help-center-feed-contract.test.ts

      - name: Require Supabase deployment access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN in the squashhub-support-publisher GitHub environment."
            exit 1
          fi

      - name: Deploy only the reviewed Help Center support functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          npx --yes supabase@2.118.0 functions deploy help-center-ticket-feed
          --project-ref bzbuppwzljadulwntjys
          && npx --yes supabase@2.118.0 functions deploy help-center-case-context
          --project-ref bzbuppwzljadulwntjys
