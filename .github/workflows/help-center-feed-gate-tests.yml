name: Help Center feed gate tests

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/pending-migrations/**"
      - "supabase/tests/help-center-pilot-gate/**"
      - ".github/workflows/help-center-feed-gate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated PostgreSQL feed-gate contract tests
        run: >-
          docker run --rm --user postgres
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace
          postgres:17
          bash supabase/tests/help-center-pilot-gate/run.sh
